<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulating a Stopping Strategy | ECON 510</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Times New Roman', serif;
      background: #fdf6e3;
      color: #586e75;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.5rem;
    }
    h2 { font-size: 1.3rem; margin-bottom: 0.6rem; }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem 1.2rem;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 480px;
    }
    .ctrl {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .ctrl label {
      min-width: 2.6em;
      text-align: right;
    }
    .ctrl input[type=range] { flex: 1; min-width: 0; accent-color: #586e75; }
    .ctrl .val {
      font-weight: bold;
      min-width: 2.8em;
      text-align: left;
      font-size: 0.9rem;
    }
    .buttons { justify-content: center; }
    button {
      font-family: 'Times New Roman', serif;
      font-size: 0.9rem;
      padding: 0.2rem 0.8rem;
      background: #586e75;
      color: #fdf6e3;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { background: #93a1a1; cursor: default; }
    button:focus-visible { outline: 2px solid #268bd2; outline-offset: 2px; }
    svg { max-width: 520px; width: 100%; display: block; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem 1.2rem;
      margin-top: -0.3em;
      font-size: 0.85rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.3rem; }
    .legend-swatch { width: 22px; height: 3px; border-radius: 1px; }
    .info {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      text-align: center;
      min-height: 1.5em;
    }
    .axis-label {
      font-family: KaTeX_Math, 'Times New Roman', serif;
      font-size: 18px;
      font-style: italic;
      fill: #586e75;
    }
    .tick-label {
      font-family: KaTeX_Main, 'Times New Roman', serif;
      font-size: 13px;
      fill: #586e75;
    }
    .tick-label.z { fill: #dc322f; font-weight: bold; }
  </style>
    <!-- Google Analytics -->
    <script async src="/E510/js/ga.js"></script>
</head>
<body>
  <h2>Simulating a Stopping Strategy</h2>

  <div class="controls">
    <div class="ctrl">
      <label>$z$</label>
      <input type="range" id="sl-z" min="-8" max="0" step="1" value="-2">
      <span class="val" id="vl-z">&minus;2</span>
    </div>
    <div class="ctrl">
      <label>$v$</label>
      <input type="range" id="sl-v" min="5" max="25" step="0.5" value="10">
      <span class="val" id="vl-v">10</span>
    </div>
    <div class="ctrl">
      <label>$p_0$</label>
      <input type="range" id="sl-p0" min="0.5" max="10" step="0.5" value="4">
      <span class="val" id="vl-p0">4</span>
    </div>
    <div class="ctrl">
      <label>$\delta$</label>
      <input type="range" id="sl-delta" min="0.5" max="0.99" step="0.01" value="0.90">
      <span class="val" id="vl-delta">0.90</span>
    </div>
    <div class="ctrl">
      <label>speed</label>
      <input type="range" id="sl-speed" min="1" max="10" step="1" value="3">
      <span class="val" id="vl-speed">3/s</span>
    </div>
    <div class="ctrl buttons">
      <button id="btn-run">Start</button>
      <button id="btn-fast">Run to 1000</button>
    </div>
  </div>

  <svg id="plot" viewBox="0 0 560 380">
    <defs>
      <clipPath id="clip">
        <rect id="clip-rect"/>
      </clipPath>
      <marker id="arr" markerWidth="10" markerHeight="5" refX="9" refY="2.5" orient="auto">
        <polygon points="0 0, 10 2.5, 0 5" fill="#586e75"/>
      </marker>
    </defs>
    <g id="g-grid"></g>
    <g id="g-z" clip-path="url(#clip)"></g>
    <g id="g-path" clip-path="url(#clip)"></g>
    <g id="g-axes"></g>
    <g id="g-ticks"></g>
  </svg>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#268bd2"></div><span>$s_t$</span></div>
    <div class="legend-item"><div class="legend-swatch" style="background:#dc322f; height:4px"></div><span>$z$</span></div>
    <div class="legend-item"><span>$p_t = 2^{s_t}\cdot p_0$</span></div>
  </div>

  <div class="info" id="info"></div>
  <div class="info" id="last"></div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
  (function() {
    const K = s => katex.renderToString(s, { throwOnError: false });
    const minus = v => String(v).replace('-', '−');
    renderMathInElement(document.body, {
      delimiters: [{ left: '$', right: '$', display: false }], throwOnError: false
    });

    // Layout
    const M = { left: 50, right: 24, top: 24, bottom: 40 };
    const VW = 560, VH = 380;
    const PW = VW - M.left - M.right;
    const PH = VH - M.top - M.bottom;
    const WT = 16;            // periods in view
    const WS = 10;            // states in view
    const NRUNS = 1000;
    const EPS = 1e-4;         // a path still running once delta^t < EPS pays ~0; end it there
    const SPEEDS = [1, 2, 3, 5, 8, 12, 20, 30, 50, 80];   // steps per second

    const cr = document.getElementById('clip-rect');
    cr.setAttribute('x', M.left - 8);
    cr.setAttribute('y', M.top - 8);
    cr.setAttribute('width', PW + 16);
    cr.setAttribute('height', PH + 8);

    const gGrid  = document.getElementById('g-grid');
    const gZ     = document.getElementById('g-z');
    const gPath  = document.getElementById('g-path');
    const gAxes  = document.getElementById('g-axes');
    const gTicks = document.getElementById('g-ticks');
    const info   = document.getElementById('info');
    const lastEl = document.getElementById('last');
    const btnRun  = document.getElementById('btn-run');
    const btnFast = document.getElementById('btn-fast');

    // Parameters
    let P = { z: -2, v: 10, p0: 4, delta: 0.9 };
    let speed = SPEEDS[2];

    // Statistics over completed runs
    let nRuns = 0, sumPay = 0, lastRun = null;

    // Animation state
    let running = false;
    let path, next, frac, hit, holdUntil, cam;

    // Model
    function payoffAtZ() { return P.v - P.p0 * Math.pow(2, P.z); }
    function exactValue() {
      if (P.z >= 0) return payoffAtZ();
      const d = P.delta;
      const r = (1 - Math.sqrt(1 - d * d)) / d;
      return payoffAtZ() * Math.pow(r, -P.z);
    }
    function randomStep() { return Math.random() < 0.5 ? 1 : -1; }

    // One run without animation
    function simulateOne() {
      let s = 0, t = 0, dt = 1;
      if (s <= P.z) return { t: 0, pay: payoffAtZ(), truncated: false };
      while (true) {
        s += randomStep(); t++; dt *= P.delta;
        if (s <= P.z) return { t, pay: dt * payoffAtZ(), truncated: false };
        if (dt < EPS) return { t, pay: 0, truncated: true };
      }
    }

    function initialSLo() { return Math.min(P.z - 1, -3); }

    function newPath() {
      path = [0];              // path[t] = s_t
      next = randomStep();
      frac = 0;
      hit = null;
      cam = { tLo: 0, sLo: initialSLo(), sLoTarget: initialSLo() };
    }

    function record(res) {
      nRuns++;
      sumPay += res.pay;
      lastRun = res;
    }

    function finishRun(res, now) {
      record(res);
      hit = res;
      holdUntil = now + Math.max(150, 900 / Math.sqrt(speed));
      updateInfo();
      if (nRuns >= NRUNS) { running = false; updateButtons(); }
    }

    function commitStep(now) {
      const s = path[path.length - 1] + next;
      path.push(s);
      const t = path.length - 1;
      const dt = Math.pow(P.delta, t);
      if (s <= P.z) return finishRun({ t, pay: dt * payoffAtZ(), truncated: false }, now);
      if (dt < EPS) return finishRun({ t, pay: 0, truncated: true }, now);
      next = randomStep();
    }

    // Head of the path (interpolated between committed steps)
    function headT() { return path.length - 1 + (hit ? 0 : frac); }
    function headS() { return path[path.length - 1] + (hit ? 0 : next * frac); }

    // Camera: follow the head in time; move vertically only when the head leaves the view
    function updateCamera(dtSec) {
      cam.tLo = Math.max(0, headT() - 0.75 * WT);
      const sH = headS();
      if (sH > cam.sLoTarget + WS - 0.5 || sH < cam.sLoTarget + 0.5) {
        cam.sLoTarget = Math.max(P.z - 1, Math.round(sH - WS / 2));
      }
      cam.sLo += (cam.sLoTarget - cam.sLo) * Math.min(1, dtSec * 6);
      if (Math.abs(cam.sLoTarget - cam.sLo) < 1e-3) cam.sLo = cam.sLoTarget;
    }

    // Drawing
    function svgEl(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }
    function clearGroup(g) { while (g.firstChild) g.removeChild(g.firstChild); }

    function draw() {
      clearGroup(gGrid); clearGroup(gZ); clearGroup(gPath);
      clearGroup(gAxes); clearGroup(gTicks);

      const { tLo, sLo } = cam;
      const toX = t => M.left + (t - tLo) / WT * PW;
      const toY = s => M.top + PH - (s - sLo) / WS * PH;

      const tFirst = Math.ceil(tLo), tLast = Math.floor(tLo + WT);
      const sFirst = Math.ceil(sLo - 1e-9), sLast = Math.floor(sLo + WS + 1e-9);

      // Grid
      for (let t = tFirst; t <= tLast; t++) {
        const x = toX(t);
        gGrid.appendChild(svgEl('line', {
          x1: x, y1: M.top, x2: x, y2: M.top + PH, stroke: '#eee8d5', 'stroke-width': 1
        }));
      }
      for (let s = sFirst; s <= sLast; s++) {
        const y = toY(s);
        gGrid.appendChild(svgEl('line', {
          x1: M.left, y1: y, x2: M.left + PW, y2: y, stroke: '#eee8d5', 'stroke-width': 1
        }));
      }

      // Threshold z: thick red line, or a marker at the bottom when it is below the view
      if (P.z >= sLo - 1e-9 && P.z <= sLo + WS + 1e-9) {
        const y = toY(P.z);
        gZ.appendChild(svgEl('line', {
          x1: M.left, y1: y, x2: M.left + PW, y2: y, stroke: '#dc322f', 'stroke-width': 4
        }));
      } else if (P.z < sLo) {
        const x = M.left + 18, y = M.top + PH - 6;
        gZ.appendChild(svgEl('polygon', {
          points: `${x - 7},${y - 9} ${x + 7},${y - 9} ${x},${y}`, fill: '#dc322f'
        }));
        const lbl = svgEl('text', {
          x: x + 12, y: y - 1, class: 'axis-label', fill: '#dc322f', style: 'fill:#dc322f'
        });
        lbl.textContent = 'z';
        gZ.appendChild(lbl);
      }

      // Path
      const t0 = Math.max(0, Math.floor(tLo) - 1);
      const tEnd = path.length - 1;
      let pts = '';
      for (let t = t0; t <= tEnd; t++) pts += `${toX(t).toFixed(1)},${toY(path[t]).toFixed(1)} `;
      if (!hit) pts += `${toX(headT()).toFixed(1)},${toY(headS()).toFixed(1)}`;
      gPath.appendChild(svgEl('polyline', {
        points: pts.trim(), fill: 'none', stroke: '#268bd2', 'stroke-width': 2.5,
        'stroke-linecap': 'round', 'stroke-linejoin': 'round'
      }));
      for (let t = Math.max(t0, tFirst - 1); t <= tEnd; t++) {
        gPath.appendChild(svgEl('circle', {
          cx: toX(t), cy: toY(path[t]), r: 3, fill: '#268bd2', stroke: '#fdf6e3', 'stroke-width': 1
        }));
      }
      gPath.appendChild(svgEl('circle', {
        cx: toX(headT()), cy: toY(headS()), r: 5.5, fill: '#268bd2', stroke: '#fdf6e3', 'stroke-width': 1.5
      }));
      if (hit && !hit.truncated) {
        gPath.appendChild(svgEl('circle', {
          cx: toX(headT()), cy: toY(headS()), r: 10, fill: 'none', stroke: '#dc322f', 'stroke-width': 2
        }));
      }

      // Axes
      gAxes.appendChild(svgEl('line', {
        x1: M.left, y1: M.top + PH, x2: M.left + PW + 8, y2: M.top + PH,
        stroke: '#586e75', 'stroke-width': 2, 'marker-end': 'url(#arr)'
      }));
      gAxes.appendChild(svgEl('line', {
        x1: M.left, y1: M.top + PH, x2: M.left, y2: M.top - 8,
        stroke: '#586e75', 'stroke-width': 2, 'marker-end': 'url(#arr)'
      }));
      const tlbl = svgEl('text', { x: M.left + PW + 12, y: M.top + PH + 5, class: 'axis-label', 'text-anchor': 'start' });
      tlbl.textContent = 't';
      gTicks.appendChild(tlbl);
      const slbl = svgEl('text', { x: M.left + 9, y: M.top - 4, class: 'axis-label', 'text-anchor': 'start' });
      slbl.textContent = 's';
      gTicks.appendChild(slbl);

      // Time ticks (thinned once labels get long)
      const every = tLast >= 1000 ? 5 : tLast >= 100 ? 2 : 1;
      for (let t = tFirst; t <= tLast; t++) {
        const x = toX(t);
        if (x < M.left - 0.5 || x > M.left + PW) continue;
        gTicks.appendChild(svgEl('line', {
          x1: x, y1: M.top + PH, x2: x, y2: M.top + PH + 6, stroke: '#586e75', 'stroke-width': 1.5
        }));
        if (t % every === 0) {
          const lb = svgEl('text', { x: x, y: M.top + PH + 20, class: 'tick-label', 'text-anchor': 'middle' });
          lb.textContent = t;
          gTicks.appendChild(lb);
        }
      }

      // State ticks
      for (let s = sFirst; s <= sLast; s++) {
        const y = toY(s);
        if (y < M.top - 0.5 || y > M.top + PH + 0.5) continue;
        gTicks.appendChild(svgEl('line', {
          x1: M.left - 5, y1: y, x2: M.left, y2: y, stroke: '#586e75', 'stroke-width': 1.5
        }));
        const lb = svgEl('text', {
          x: M.left - 8, y: y + 4, class: s === P.z ? 'tick-label z' : 'tick-label', 'text-anchor': 'end'
        });
        lb.textContent = minus(s);
        gTicks.appendChild(lb);
      }
    }

    // Read-outs
    function updateInfo() {
      const exact = `V^{z}(0) = ${exactValue().toFixed(2)}`;
      if (nRuns === 0) {
        info.innerHTML = K(`\\text{runs} = 0 \\qquad ${exact}`);
        lastEl.innerHTML = '';
        return;
      }
      const avg = (sumPay / nRuns).toFixed(2);
      info.innerHTML = K(`\\text{runs} = ${nRuns} \\qquad \\text{simulated value} = ${avg} \\qquad ${exact}`);

      const r = lastRun;
      lastEl.innerHTML = r.truncated
        ? K(`\\text{last run: } \\delta^{${r.t}} \\approx 0, \\ \\text{payoff} \\approx 0`)
        : K(`\\text{last run: stops at } t = ${r.t}, \\ \\delta^{${r.t}}\\,(v - p_0 2^{z}) = ${r.pay.toFixed(2)}`);
    }

    function updateButtons() {
      if (nRuns >= NRUNS) {
        btnRun.textContent = 'Restart';
        btnFast.disabled = true;
        return;
      }
      btnFast.disabled = false;
      const started = nRuns > 0 || path.length > 1 || frac > 0;
      btnRun.textContent = running ? 'Pause' : (started ? 'Resume' : 'Start');
    }

    function resetAll() {
      running = false;
      nRuns = 0; sumPay = 0; lastRun = null;
      newPath();
      updateInfo();
      updateButtons();
      kick();
    }

    // Main loop (idle when nothing moves)
    let lastTs = null, looping = false;
    function frame(ts) {
      const dtSec = lastTs === null ? 0 : Math.min(0.1, (ts - lastTs) / 1000);
      lastTs = ts;

      if (running) {
        if (hit) {
          if (ts >= holdUntil) newPath();
        } else if (path.length === 1 && frac === 0 && path[0] <= P.z) {
          finishRun({ t: 0, pay: payoffAtZ(), truncated: false }, ts);
        } else {
          frac += dtSec * speed;
          while (frac >= 1 && !hit) { frac -= 1; commitStep(ts); }
          if (hit) frac = 0;
        }
      }

      updateCamera(dtSec);
      draw();

      if (running || cam.sLo !== cam.sLoTarget) {
        requestAnimationFrame(frame);
      } else {
        looping = false; lastTs = null;
      }
    }
    function kick() {
      if (!looping) { looping = true; requestAnimationFrame(frame); }
    }

    // Controls
    const sliders = [
      { id: 'sl-z',     vl: 'vl-z',     key: 'z',     fmt: v => minus(v) },
      { id: 'sl-v',     vl: 'vl-v',     key: 'v',     fmt: v => v },
      { id: 'sl-p0',    vl: 'vl-p0',    key: 'p0',    fmt: v => v },
      { id: 'sl-delta', vl: 'vl-delta', key: 'delta', fmt: v => v.toFixed(2) },
    ];
    for (const s of sliders) {
      const sl = document.getElementById(s.id);
      const vl = document.getElementById(s.vl);
      sl.addEventListener('input', () => {
        P[s.key] = parseFloat(sl.value);
        vl.textContent = s.fmt(P[s.key]);
        resetAll();      // a new strategy or new parameters: start counting again
      });
    }

    const slSpeed = document.getElementById('sl-speed');
    const vlSpeed = document.getElementById('vl-speed');
    slSpeed.addEventListener('input', () => {
      speed = SPEEDS[parseInt(slSpeed.value, 10) - 1];
      vlSpeed.textContent = speed + '/s';
    });

    btnRun.addEventListener('click', () => {
      if (nRuns >= NRUNS) { resetAll(); running = true; }
      else running = !running;
      updateButtons();
      kick();
    });

    btnFast.addEventListener('click', () => {
      running = false;
      while (nRuns < NRUNS) record(simulateOne());
      newPath();
      updateInfo();
      updateButtons();
      kick();
    });

    newPath();
    updateInfo();
    updateButtons();
    draw();
  })();
  </script>
</body>
</html>
